<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="self-hosted-llm-evals-lab: a prompt-ablation harness for self-hosted LLMs that ships its own error bars, shown beside five strategy bars with Wilson confidence intervals" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/>
    <stop offset="0.55" stop-color="#0c1013"/>
    <stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.7" fill="#161d26"/>
  </pattern>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3987e5" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/>
    <stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6a7480"/>
    <stop offset="0.3" stop-color="#e6ebf1"/>
    <stop offset="0.55" stop-color="#98a3af"/>
    <stop offset="0.8" stop-color="#f7f9fb"/>
    <stop offset="1" stop-color="#737d89"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="1000" height="340" fill="url(#bg)"/>
<rect x="0" y="0" width="1000" height="340" fill="url(#dots)"/>

<text x="46" y="60" fill="#3987e5" font-size="14" font-weight="700" letter-spacing="3.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LLM EVALUATION / MEASUREMENT</text>

<text x="46" y="114" fill="#f3f6f9" font-size="35" font-weight="700" letter-spacing="0.2">The finding is the headline.</text>
<text x="46" y="158" fill="#f3f6f9" font-size="35" font-weight="700" letter-spacing="0.2">The instrument is the product.</text>

<rect x="46" y="180" width="156" height="2.5" fill="url(#rule)"/>

<text x="46" y="214" fill="#9aa5b1" font-size="18">Prompt ablation on a self-hosted Llama 3.1 8B that ships its own</text>
<text x="46" y="240" fill="#9aa5b1" font-size="18">error bars: Wilson intervals, <tspan fill="#e6ebf1" font-weight="700">McNemar tests</tspan>, and a determinism</text>
<text x="46" y="266" fill="#9aa5b1" font-size="18">gate that runs before any comparison is allowed to count.</text>

<rect x="46" y="288" width="96" height="26" fill="url(#chip)" stroke="#3a4552" stroke-width="1.2"/>
<text x="94" y="306" fill="#9aa5b1" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">serve</text>
<rect x="150" y="288" width="88" height="26" fill="url(#chip)" stroke="#3a4552" stroke-width="1.2"/>
<text x="194" y="306" fill="#9aa5b1" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">eval</text>
<rect x="246" y="288" width="102" height="26" fill="url(#chip)" stroke="#3a4552" stroke-width="1.2"/>
<text x="297" y="306" fill="#9aa5b1" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ablate</text>
<rect x="356" y="288" width="124" height="26" fill="#141d27" stroke="url(#chrome)" stroke-width="1.8"/>
<text x="418" y="306" fill="#f3f6f9" font-size="14" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">validate</text>

<g transform="translate(614,52)">
  <rect x="0" y="0" width="342" height="248" fill="#0a0e12" stroke="#212b36" stroke-width="1.2"/>

  <text x="18" y="26" fill="#6b7683" font-size="11" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ACCURACY, n=20, WILSON 95% CI</text>

  <line x1="18" y1="212" x2="338" y2="212" stroke="#212b36" stroke-width="1.2"/>
  <line x1="18" y1="160" x2="338" y2="160" stroke="#161d26" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="18" y1="108" x2="338" y2="108" stroke="#161d26" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="18" y1="56" x2="338" y2="56" stroke="#161d26" stroke-width="1" stroke-dasharray="3 4"/>

  <g fill="#3987e5">
    <rect x="34" y="118" width="34" height="94" rx="4"/>
    <rect x="98" y="134" width="34" height="78" rx="4"/>
    <rect x="226" y="134" width="34" height="78" rx="4"/>
  </g>
  <rect x="162" y="165" width="34" height="47" rx="4" fill="#d95926"/>
  <rect x="290" y="103" width="34" height="109" rx="4" fill="#199e70"/>

  <g stroke="#c8d2dc" stroke-width="1.6">
    <line x1="51" y1="90" x2="51" y2="151"/><line x1="43" y1="90" x2="59" y2="90"/><line x1="43" y1="151" x2="59" y2="151"/>
    <line x1="115" y1="103" x2="115" y2="169"/><line x1="107" y1="103" x2="123" y2="103"/><line x1="107" y1="169" x2="123" y2="169"/>
    <line x1="179" y1="134" x2="179" y2="205"/><line x1="171" y1="134" x2="187" y2="134"/><line x1="171" y1="205" x2="187" y2="205"/>
    <line x1="243" y1="103" x2="243" y2="169"/><line x1="235" y1="103" x2="251" y2="103"/><line x1="235" y1="169" x2="251" y2="169"/>
    <line x1="307" y1="80" x2="307" y2="142"/><line x1="299" y1="80" x2="315" y2="80"/><line x1="299" y1="142" x2="315" y2="142"/>
  </g>

  <g font-size="11" fill="#c8d2dc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="51" y="228">base</text>
    <text x="115" y="228">instr</text>
    <text x="179" y="228" fill="#e0763f">CoT</text>
    <text x="243" y="228">few</text>
    <text x="307" y="228" fill="#35b183">self</text>
  </g>

  <text x="179" y="126" fill="#e0763f" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-25pp</text>
</g>

<text x="785" y="322" fill="#5c6773" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">an 8B model got worse; the interval says how sure</text>
</svg>
