<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-label="Call graph: four Makefile targets drive four pipelines that reach one Ollama endpoint over two API surfaces, with a standalone cached wrapper parked off the path" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dota" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="nda" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rla" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3987e5" stop-opacity="0.95"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
  <marker id="arga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="aroa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
  <marker id="arba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
</defs>
<rect x="0" y="0" width="900" height="690" fill="url(#bga)"/>
<rect x="0" y="0" width="900" height="690" fill="url(#dota)"/>
<text x="36" y="42" fill="#3987e5" font-size="15" font-weight="700" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CALL GRAPH</text>
<text x="36" y="78" fill="#f3f6f9" font-size="25" font-weight="700">Four pipelines, two API surfaces, one served model</text>
<rect x="36" y="92" width="130" height="2.5" fill="url(#rla)"/>
<rect x="32" y="118" width="198" height="36" fill="#141d27" stroke="#46525f" stroke-width="1.5" rx="4"/>
<text x="131" y="142" fill="#c8d2dc" font-size="17" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make eval</text>
<line x1="131" y1="154" x2="131" y2="184" stroke="#5a6673" stroke-width="1.6" marker-end="url(#ara)"/>
<rect x="32" y="186" width="198" height="96" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="131" y="214" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">run_eval.py</text>
<text x="131" y="242" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">subprocess to</text>
<text x="131" y="264" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">python -m lm_eval</text>
<line x1="131" y1="282" x2="131" y2="314" stroke="#3987e5" stroke-width="1.8" marker-end="url(#arba)"/>
<rect x="246" y="118" width="198" height="36" fill="#141d27" stroke="#46525f" stroke-width="1.5" rx="4"/>
<text x="345" y="142" fill="#c8d2dc" font-size="17" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make ablation</text>
<line x1="345" y1="154" x2="345" y2="184" stroke="#5a6673" stroke-width="1.6" marker-end="url(#ara)"/>
<rect x="246" y="186" width="198" height="96" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="345" y="214" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">optimize_prompt.py</text>
<text x="345" y="242" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">infer.py</text>
<text x="345" y="264" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4 templates, k=5</text>
<line x1="345" y1="282" x2="345" y2="314" stroke="#199e70" stroke-width="1.8" marker-end="url(#arga)"/>
<rect x="460" y="118" width="198" height="36" fill="#141d27" stroke="#46525f" stroke-width="1.5" rx="4"/>
<text x="559" y="142" fill="#c8d2dc" font-size="17" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make perf</text>
<line x1="559" y1="154" x2="559" y2="184" stroke="#5a6673" stroke-width="1.6" marker-end="url(#ara)"/>
<rect x="460" y="186" width="198" height="96" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="559" y="214" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">load_test.py</text>
<text x="559" y="242" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ThreadPoolExecutor</text>
<text x="559" y="264" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">streaming TTFT</text>
<line x1="559" y1="282" x2="559" y2="314" stroke="#199e70" stroke-width="1.8" marker-end="url(#arga)"/>
<rect x="674" y="118" width="198" height="36" fill="#141d27" stroke="#46525f" stroke-width="1.5" rx="4"/>
<text x="773" y="142" fill="#c8d2dc" font-size="17" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make validate</text>
<line x1="773" y1="154" x2="773" y2="184" stroke="#5a6673" stroke-width="1.6" marker-end="url(#ara)"/>
<rect x="674" y="186" width="198" height="96" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="773" y="214" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">validate.py</text>
<text x="773" y="242" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5 prompts x 5 trials</text>
<text x="773" y="264" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">greedy, seed 42</text>
<line x1="773" y1="282" x2="773" y2="314" stroke="#199e70" stroke-width="1.8" marker-end="url(#arga)"/>
<rect x="32" y="316" width="198" height="62" fill="#0e1620" stroke="#3987e5" stroke-width="1.8" rx="4"/>
<text x="131" y="342" fill="#6fa8ec" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/v1/chat/completions</text>
<text x="131" y="364" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OpenAI-compatible</text>
<rect x="246" y="316" width="626" height="62" fill="#0d1a16" stroke="#199e70" stroke-width="1.8" rx="4"/>
<text x="559" y="342" fill="#35b183" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/api/generate</text>
<text x="559" y="364" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ollama native</text>
<line x1="131" y1="378" x2="131" y2="410" stroke="#5a6673" stroke-width="1.6" marker-end="url(#ara)"/>
<line x1="559" y1="378" x2="559" y2="410" stroke="#5a6673" stroke-width="1.6" marker-end="url(#ara)"/>
<rect x="32" y="412" width="840" height="74" fill="#141d27" stroke="#8f9aa6" stroke-width="1.8" rx="4"/>
<text x="452" y="444" fill="#f3f6f9" font-size="23" text-anchor="middle" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Ollama</text>
<text x="452" y="470" fill="#9aa5b1" font-size="16" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">llama3.1:8b     Q4_0     ~4.7 GB     port 11434</text>
<text x="36" y="512" fill="#5c6773" font-size="15" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">process lifecycle owned by serve/serve.py, started with make serve, health-checked on /api/tags</text>
<rect x="32" y="534" width="840" height="100" fill="#0a0e12" stroke="#4a5663" stroke-width="1.4" stroke-dasharray="6 5" rx="4"/>
<text x="56" y="566" fill="#c8d2dc" font-size="17" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">eval_runner/model.py</text>
<text x="56" y="592" fill="#7d8896" font-size="15" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OllamaEvalModel + PromptCache, SHA-256 keyed, writes .cache/{hash}.json,</text>
<text x="56" y="614" fill="#7d8896" font-size="15" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">speaks both surfaces above</text>
<rect x="596" y="552" width="252" height="34" fill="#1c150c" stroke="#8a6a3c" stroke-width="1.5" rx="4"/>
<text x="722" y="575" fill="#c9985e" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NOT ON ANY MAKEFILE PATH</text>
<text x="722" y="604" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no module imports it; every</text>
<text x="722" y="624" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pipeline calls requests.post direct</text>
<text x="36" y="664" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Three of the four pipelines speak Ollama's native API. Only lm-eval-harness uses the OpenAI-compatible</text>
<text x="36" y="686" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">surface, which is why the eval lane runs as a subprocess instead of through the shared wrapper below.</text>
</svg>
