<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Call graph: four Makefile targets drive four pipelines that reach one Ollama endpoint over two different API surfaces, with a standalone cached model wrapper parked off the path" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dotsa" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="nodea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rulea" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3987e5" stop-opacity="0.95"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
  <marker id="arwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5663"/>
  </marker>
  <marker id="arwba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/>
  </marker>
  <marker id="arwga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/>
  </marker>
  <marker id="arwoa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#bga)"/>
<rect x="0" y="0" width="1000" height="560" fill="url(#dotsa)"/>

<text x="40" y="46" fill="#3987e5" font-size="13" font-weight="700" letter-spacing="3.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CALL GRAPH</text>
<text x="40" y="72" fill="#f3f6f9" font-size="19" font-weight="700">Four pipelines, two API surfaces, one served model</text>
<rect x="40" y="84" width="120" height="2" fill="url(#rulea)"/>
<rect x="40" y="106" width="168" height="28" fill="#141d27" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="124" y="125" fill="#c8d2dc" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make eval</text>
<line x1="124" y1="134" x2="124" y2="158" stroke="#4a5663" stroke-width="1.4" marker-end="url(#arwa)"/>
<rect x="40" y="160" width="168" height="82" fill="url(#nodea)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="124" y="186" fill="#f3f6f9" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">run_eval.py</text>
<text x="124" y="206" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">subprocess to</text>
<text x="124" y="223" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">python -m lm_eval</text>
<rect x="220" y="106" width="168" height="28" fill="#141d27" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="304" y="125" fill="#c8d2dc" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make ablation</text>
<line x1="304" y1="134" x2="304" y2="158" stroke="#4a5663" stroke-width="1.4" marker-end="url(#arwa)"/>
<rect x="220" y="160" width="168" height="82" fill="url(#nodea)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="304" y="186" fill="#f3f6f9" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">optimize_prompt.py</text>
<text x="304" y="206" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">infer.py</text>
<text x="304" y="223" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4 templates, k=5 vote</text>
<rect x="400" y="106" width="168" height="28" fill="#141d27" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="484" y="125" fill="#c8d2dc" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make perf</text>
<line x1="484" y1="134" x2="484" y2="158" stroke="#4a5663" stroke-width="1.4" marker-end="url(#arwa)"/>
<rect x="400" y="160" width="168" height="82" fill="url(#nodea)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="484" y="186" fill="#f3f6f9" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">load_test.py</text>
<text x="484" y="206" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ThreadPoolExecutor</text>
<text x="484" y="223" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">streaming TTFT</text>
<rect x="580" y="106" width="168" height="28" fill="#141d27" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="664" y="125" fill="#c8d2dc" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make validate</text>
<line x1="664" y1="134" x2="664" y2="158" stroke="#4a5663" stroke-width="1.4" marker-end="url(#arwa)"/>
<rect x="580" y="160" width="168" height="82" fill="url(#nodea)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="664" y="186" fill="#f3f6f9" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">validate.py</text>
<text x="664" y="206" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5 prompts x 5 trials</text>
<text x="664" y="223" fill="#6b7683" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">greedy, seed 42</text>

<line x1="124" y1="242" x2="124" y2="282" stroke="#3987e5" stroke-width="1.6" marker-end="url(#arwba)"/>
<rect x="40" y="284" width="168" height="46" fill="#0e1620" stroke="#3987e5" stroke-width="1.6" rx="3"/>
<text x="124" y="305" fill="#6fa8ec" font-size="12.5" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/v1/chat/completions</text>
<text x="124" y="321" fill="#6b7683" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OpenAI-compatible</text>

<line x1="304" y1="242" x2="304" y2="282" stroke="#199e70" stroke-width="1.6" marker-end="url(#arwga)"/>
<line x1="484" y1="242" x2="484" y2="282" stroke="#199e70" stroke-width="1.6" marker-end="url(#arwga)"/>
<line x1="664" y1="242" x2="664" y2="282" stroke="#199e70" stroke-width="1.6" marker-end="url(#arwga)"/>
<rect x="220" y="284" width="528" height="46" fill="#0d1a16" stroke="#199e70" stroke-width="1.6" rx="3"/>
<text x="484" y="305" fill="#35b183" font-size="12.5" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/api/generate</text>
<text x="484" y="321" fill="#6b7683" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ollama native</text>

<line x1="124" y1="330" x2="124" y2="374" stroke="#4a5663" stroke-width="1.4" marker-end="url(#arwa)"/>
<line x1="484" y1="330" x2="484" y2="374" stroke="#4a5663" stroke-width="1.4" marker-end="url(#arwa)"/>

<rect x="40" y="376" width="708" height="60" fill="#141d27" stroke="#8f9aa6" stroke-width="1.6" rx="3"/>
<text x="394" y="402" fill="#f3f6f9" font-size="16" font-weight="700" text-anchor="middle">Ollama</text>
<text x="394" y="422" fill="#9aa5b1" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">llama3.1:8b   Q4_0   ~4.7 GB   port 11434</text>

<text x="40" y="466" fill="#5c6773" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">process lifecycle owned by serve/serve.py, started with make serve, health-checked on /api/tags</text>

<rect x="782" y="106" width="178" height="330" fill="#0a0e12" stroke="#4a5663" stroke-width="1.3" stroke-dasharray="5 4" rx="3"/>
<text x="871" y="132" fill="#9aa5b1" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">eval_runner/</text>
<text x="871" y="150" fill="#9aa5b1" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">model.py</text>
<line x1="800" y1="164" x2="942" y2="164" stroke="#232d38" stroke-width="1"/>
<text x="871" y="188" fill="#c8d2dc" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OllamaEvalModel</text>
<text x="871" y="208" fill="#c8d2dc" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PromptCache</text>
<text x="871" y="226" fill="#6b7683" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SHA-256 keyed</text>
<text x="871" y="246" fill="#6b7683" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.cache/{hash}.json</text>
<text x="871" y="272" fill="#6b7683" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">speaks both</text>
<text x="871" y="288" fill="#6b7683" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">surfaces above</text>
<line x1="800" y1="308" x2="942" y2="308" stroke="#232d38" stroke-width="1"/>
<text x="871" y="332" fill="#c9985e" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NOT ON ANY</text>
<text x="871" y="348" fill="#c9985e" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MAKEFILE PATH</text>
<text x="871" y="372" fill="#6b7683" font-size="10.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no module imports it;</text>
<text x="871" y="388" fill="#6b7683" font-size="10.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every pipeline calls</text>
<text x="871" y="404" fill="#6b7683" font-size="10.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">requests.post direct</text>

<text x="40" y="510" fill="#6b7683" font-size="12">Three of the four pipelines speak Ollama's native API. Only lm-eval-harness uses the OpenAI-compatible surface,</text>
<text x="40" y="530" fill="#6b7683" font-size="12">which is why the eval lane runs as a subprocess instead of through the shared wrapper on the right.</text>
</svg>
