<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Confidence routing: five samples are extracted by a three-tier regex and voted, then high-confidence answers are served from the small model while low-confidence answers cascade to a larger one" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bgc" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dotsc" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="nodec" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rulec" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3987e5" stop-opacity="0.95"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
  <marker id="arwc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5663"/></marker>
  <marker id="arwgc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="arwoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="340" fill="url(#bgc)"/>
<rect x="0" y="0" width="1000" height="340" fill="url(#dotsc)"/>

<text x="24" y="46" fill="#3987e5" font-size="13" font-weight="700" letter-spacing="3.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PRODUCTION CASCADE</text>
<text x="24" y="72" fill="#f3f6f9" font-size="19" font-weight="700">Spending the expensive model only where the cheap one is unsure</text>
<rect x="24" y="84" width="120" height="2" fill="url(#rulec)"/>

<rect x="24" y="140" width="104" height="76" fill="url(#nodec)" stroke="#3a4552" stroke-width="1.4" rx="3"/>
<text x="76" y="174" fill="#f3f6f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">prompt</text>
<text x="76" y="194" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one item</text>
<line x1="128" y1="178" x2="146" y2="178" stroke="#4a5663" stroke-width="1.7" marker-end="url(#arwc)"/>

<rect x="148" y="140" width="160" height="76" fill="url(#nodec)" stroke="#3987e5" stroke-width="1.5" rx="3"/>
<text x="228" y="169" fill="#6fa8ec" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">generate k=5</text>
<text x="228" y="189" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">temp 0.7, top_p 0.95</text>
<text x="228" y="205" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">seeds 42 to 46</text>
<line x1="308" y1="178" x2="326" y2="178" stroke="#4a5663" stroke-width="1.7" marker-end="url(#arwc)"/>

<rect x="328" y="140" width="196" height="76" fill="url(#nodec)" stroke="#3a4552" stroke-width="1.4" rx="3"/>
<text x="426" y="169" fill="#f3f6f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">extract answers</text>
<text x="426" y="189" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3-tier regex, normalizes</text>
<text x="426" y="205" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A / A. / (A) / answer is A</text>
<line x1="524" y1="178" x2="542" y2="178" stroke="#4a5663" stroke-width="1.7" marker-end="url(#arwc)"/>

<rect x="544" y="140" width="160" height="76" fill="#141d27" stroke="#8f9aa6" stroke-width="1.6" rx="3"/>
<text x="624" y="169" fill="#f3f6f9" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">majority vote</text>
<text x="624" y="189" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">confidence =</text>
<text x="624" y="205" fill="#6b7683" font-size="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">winning count / k</text>

<path d="M 704 168 L 726 168 L 726 128 L 742 128" fill="none" stroke="#199e70" stroke-width="1.8" marker-end="url(#arwgc)"/>
<path d="M 704 190 L 726 190 L 726 252 L 742 252" fill="none" stroke="#d95926" stroke-width="1.8" marker-end="url(#arwoc)"/>

<rect x="750" y="100" width="226" height="58" fill="#0d1a16" stroke="#199e70" stroke-width="1.6" rx="3"/>
<text x="863" y="124" fill="#35b183" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">confidence &gt;= 0.8</text>
<text x="863" y="143" fill="#9aa5b1" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">serve from the 8B</text>

<rect x="750" y="224" width="226" height="58" fill="#1c130e" stroke="#d95926" stroke-width="1.6" rx="3"/>
<text x="863" y="248" fill="#e0763f" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">confidence &lt;= 0.6</text>
<text x="863" y="267" fill="#9aa5b1" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cascade to a larger model</text>

<text x="24" y="300" fill="#6b7683" font-size="12">The vote is not only an accuracy trick. How lopsided the five samples were is itself a signal, and it separates the answers</text>
<text x="24" y="320" fill="#6b7683" font-size="12">worth trusting from the minority worth paying for. That is the part of this repo that survives contact with a budget.</text>
</svg>
