<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Confidence routing: five samples are extracted by a three-tier regex and voted, then high-confidence answers are served from the small model while low-confidence answers cascade to a larger one" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bgc" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dotc" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="ndc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rlc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3987e5" stop-opacity="0.95"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
  <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
  <marker id="argc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="aroc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
  <marker id="arbc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
</defs>
<rect x="0" y="0" width="900" height="540" fill="url(#bgc)"/>
<rect x="0" y="0" width="900" height="540" fill="url(#dotc)"/>
<text x="36" y="42" fill="#3987e5" font-size="15" font-weight="700" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PRODUCTION CASCADE</text>
<text x="36" y="78" fill="#f3f6f9" font-size="25" font-weight="700">Spending the big model only where the small one is unsure</text>
<rect x="36" y="92" width="130" height="2.5" fill="url(#rlc)"/>
<rect x="20" y="130" width="260" height="108" fill="url(#ndc)" stroke="#3987e5" stroke-width="1.6" rx="4"/>
<text x="150" y="166" fill="#6fa8ec" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">generate k=5</text>
<text x="150" y="196" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">temp 0.7, top_p 0.95</text>
<text x="150" y="218" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">seeds 42 to 46</text>
<line x1="280" y1="184" x2="312" y2="184" stroke="#5a6673" stroke-width="1.8" marker-end="url(#arc)"/>
<rect x="320" y="130" width="260" height="108" fill="url(#ndc)" stroke="#3a4552" stroke-width="1.6" rx="4"/>
<text x="450" y="166" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">extract answers</text>
<text x="450" y="196" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3-tier regex normalizes</text>
<text x="450" y="218" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A, A., (A), answer is A</text>
<line x1="580" y1="184" x2="612" y2="184" stroke="#5a6673" stroke-width="1.8" marker-end="url(#arc)"/>
<rect x="620" y="130" width="260" height="108" fill="url(#ndc)" stroke="#8f9aa6" stroke-width="1.6" rx="4"/>
<text x="750" y="166" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">majority vote</text>
<text x="750" y="196" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">confidence =</text>
<text x="750" y="218" fill="#7d8896" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">winning count / k</text>
<text x="20" y="118" fill="#5c6773" font-size="15" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one item in</text>
<path d="M 750 238 L 750 286 L 232 286 L 232 344" fill="none" stroke="#199e70" stroke-width="1.9" marker-end="url(#argc)"/>
<path d="M 750 238 L 750 312 L 650 312 L 650 344" fill="none" stroke="#d95926" stroke-width="1.9" marker-end="url(#aroc)"/>
<rect x="42" y="346" width="380" height="88" fill="#0d1a16" stroke="#199e70" stroke-width="1.8" rx="4"/>
<text x="232" y="382" fill="#35b183" font-size="19" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">confidence &gt;= 0.8</text>
<text x="232" y="410" fill="#9aa5b1" font-size="16" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">serve straight from the 8B</text>
<rect x="460" y="346" width="380" height="88" fill="#1c130e" stroke="#d95926" stroke-width="1.8" rx="4"/>
<text x="650" y="382" fill="#e0763f" font-size="19" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">confidence &lt;= 0.6</text>
<text x="650" y="410" fill="#9aa5b1" font-size="16" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cascade to a larger model</text>
<text x="36" y="476" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">The vote is not only an accuracy trick. How lopsided the five samples were is itself a signal, and it separates the</text>
<text x="36" y="498" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">answers worth trusting from the minority worth paying for. That is the part of this repo that survives a budget.</text>
</svg>
