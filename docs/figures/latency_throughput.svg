<text x="36" y="480" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Time to first token climbs by an order of magnitude once concurrency rises, while throughput stays flat near 65 tok/s.</text>
<text x="36" y="502" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">That is the signature of a backend that queues rather than batches: the work is serialized, so parallel callers only wait.</text>
